# Jekyll configuration — Minimal Mistakes via remote theme (GitHub Pages compatible)
# Docs: https://mmistakes.github.io/minimal-mistakes/docs/configuration/

title: Ren Shows
description: "The portfolio of Ren Shows"
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: catppuccin_mocha

media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
    categories: [image]
    rename: safe

# Hide the RSS "Feed" link in the theme footer's Follow section.
atom_feed:
  hide: true

# Project page: served at https://ren-shows.github.io/
url: "https://renshowstech.org"
baseurl: ""

# Build settings
markdown: kramdown
plugins:
  - jekyll-include-cache

# Jekyll ignores underscore dirs by default; _pages must be included.
include:
  - _pages

# Serve the site's pages and posts with sensible Minimal Mistakes defaults.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      share: true
